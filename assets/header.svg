<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', 'Roboto Mono', 'Courier New', monospace;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 5px;
      fill: #f0f6fc;
      text-transform: uppercase;
    }
    .badge {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 600;
      fill: #39d353;
      text-transform: uppercase;
    }
    .subtext {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 500;
      fill: #8b949e;
      text-transform: uppercase;
    }
    .tag {
      font-family: monospace;
      font-size: 11px;
      fill: #58a6ff;
    }
  </style>

  <!-- Background Card -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Dot Grid -->
  <rect width="900" height="240" rx="12" fill="url(#dotGrid)" opacity="0.6" />

  <!-- Top Terminal Bar -->
  <g transform="translate(30, 25)">
    <circle cx="0" cy="0" r="5" fill="#ff5f56" />
    <circle cx="15" cy="0" r="5" fill="#ffbd2e" />
    <circle cx="30" cy="0" r="5" fill="#27c93f" />
    <text x="50" y="4" class="tag">reymondaf650-del / README.md</text>
  </g>

  <!-- Title -->
  <text x="30" y="85" class="title">RAMON DARIO AGUILAR</text>

  <!-- Decorative Matrix / Git Grid Animation/Pattern -->
  <g transform="translate(30, 110)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="0" y="20" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="0" y="40" width="16" height="16" rx="3" fill="#26a641" />
    <!-- Column 2 -->
    <rect x="20" y="0" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="20" y="20" width="16" height="16" rx="3" fill="#39d353" filter="url(#glow)" />
    <rect x="20" y="40" width="16" height="16" rx="3" fill="#0e4429" />
    <!-- Column 3 -->
    <rect x="40" y="0" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="40" y="20" width="16" height="16" rx="3" fill="#161b22" />
    <rect x="40" y="40" width="16" height="16" rx="3" fill="#39d353" />
    <!-- Column 4 -->
    <rect x="60" y="0" width="16" height="16" rx="3" fill="#39d353" filter="url(#glow)" />
    <rect x="60" y="20" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="60" y="40" width="16" height="16" rx="3" fill="#006d32" />
    <!-- Column 5 -->
    <rect x="80" y="0" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="80" y="20" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="80" y="40" width="16" height="16" rx="3" fill="#26a641" />
    <!-- Column 6 -->
    <rect x="100" y="0" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="100" y="20" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="100" y="40" width="16" height="16" rx="3" fill="#161b22" />
    <!-- Column 7 -->
    <rect x="120" y="0" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="120" y="20" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="120" y="40" width="16" height="16" rx="3" fill="#39d353" />
    <!-- Column 8 -->
    <rect x="140" y="0" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="140" y="20" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="140" y="40" width="16" height="16" rx="3" fill="#0e4429" />
    <!-- Column 9 -->
    <rect x="160" y="0" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="160" y="20" width="16" height="16" rx="3" fill="#39d353" filter="url(#glow)" />
    <rect x="160" y="40" width="16" height="16" rx="3" fill="#006d32" />
    <!-- Column 10 -->
    <rect x="180" y="0" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="180" y="20" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="180" y="40" width="16" height="16" rx="3" fill="#26a641" />
    <!-- Column 11 -->
    <rect x="200" y="0" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="200" y="20" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="200" y="40" width="16" height="16" rx="3" fill="#39d353" />
    <!-- Column 12 -->
    <rect x="220" y="0" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="220" y="20" width="16" height="16" rx="3" fill="#161b22" />
    <rect x="220" y="40" width="16" height="16" rx="3" fill="#006d32" />
    <!-- Column 13 -->
    <rect x="240" y="0" width="16" height="16" rx="3" fill="#161b22" />
    <rect x="240" y="20" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="240" y="40" width="16" height="16" rx="3" fill="#26a641" />
    <!-- Column 14 -->
    <rect x="260" y="0" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="260" y="20" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="260" y="40" width="16" height="16" rx="3" fill="#0e4429" />
    <!-- Column 15 -->
    <rect x="280" y="0" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="280" y="20" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="280" y="40" width="16" height="16" rx="3" fill="#39d353" />
    <!-- Transition to abstract data blocks -->
    <rect x="310" y="0" width="32" height="16" rx="3" fill="#21262d" />
    <rect x="350" y="0" width="16" height="16" rx="3" fill="#30363d" />
    <rect x="375" y="0" width="48" height="16" rx="3" fill="#238636" opacity="0.8" />
    <rect x="310" y="20" width="60" height="16" rx="3" fill="#238636" opacity="0.6" />
    <rect x="380" y="20" width="24" height="16" rx="3" fill="#39d353" />
    <rect x="310" y="40" width="20" height="16" rx="3" fill="#30363d" />
    <rect x="340" y="40" width="55" height="16" rx="3" fill="#21262d" />
    <rect x="405" y="40" width="35" height="16" rx="3" fill="#26a641" opacity="0.7" />
