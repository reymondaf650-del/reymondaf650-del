  <!-- Tagline / Role right-aligned -->
  <text x="860" y="195" text-anchor="end" class="badge">FULL STACK DEVELOPER // AI &amp; AUTOMATION ARCHITECT</text>
  <text x="860" y="215" text-anchor="end" class="subtext">SYSTEMS ENGINEER · LINUX &amp; SERVERLESS</text>

  <!-- Bottom Accent Line -->
  <line x1="30" y1="185" x2="450" y2="185" stroke="#21262d" stroke-width="2" />
  <line x1="30" y1="185" x2="180" y2="185" stroke="#238636" stroke-width="2" />
</svg>
